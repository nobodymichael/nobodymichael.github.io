<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FBF9F4">
<title>exif cleaner — nobodymichael</title>
<link rel="stylesheet" href="../style.css">
<script src="../site.js"></script>
<style>
.drop{border:2px dashed var(--line);border-radius:20px;padding:2.2rem 1rem;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;background:var(--field)}
.drop:hover,.drop.drag{border-color:var(--red);background:rgba(245,50,44,.08)}
.meta{margin-top:1.25rem;font-size:.92rem;display:grid;gap:.4rem}
.meta div{padding:.5rem .75rem;border-radius:12px;background:var(--field);border:1px solid var(--edge);display:flex;justify-content:space-between;gap:1rem}
.meta span:last-child{font-weight:700;text-align:right;word-break:break-all}
.prev-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;gap:.75rem}
.prev-wrap img{max-width:100%;max-height:15rem;border-radius:14px;object-fit:contain}
</style>
</head>
<body>
<div class="wrap">
<header><a class="brand" href="../">nobodymichael</a></header>
<main>
<h1>exif cleaner</h1>
<p class="lead">Sprawdza ukryte metadane zdjęcia (GPS, model aparatu, datę) i tworzy czysty plik bez śladów.</p>

<div class="qrgrid">
  <div>
    <div class="drop" id="drop">
      <strong>Kliknij lub upuść zdjęcie tutaj</strong>
      <p class="hint">JPG, PNG, WebP — przetwarzane wyłącznie lokalnie</p>
      <input type="file" id="file" accept="image/jpeg,image/png,image/webp" hidden>
    </div>

    <div class="meta" id="meta" hidden></div>

    <div class="row">
      <button class="btn" id="dl" type="button" disabled>Pobierz czyste zdjęcie</button>
      <button class="btn ghost" id="clr" type="button" disabled>Wyczyść</button>
    </div>
    <p class="status" id="st"></p>
  </div>

  <div class="qr" id="box">
    <span>Podgląd zdjęcia</span>
  </div>
</div>
</main>
</div>
<footer class="wrap">Bez śledzenia i zewnętrznych skryptów. <a href="https://github.com/nobodymichael">GitHub</a></footer>

<script>
const $ = id => document.getElementById(id);
const drop = $('drop'), fileInp = $('file'), metaBox = $('meta'), dlBtn = $('dl'), clrBtn = $('clr'), box = $('box'), st = $('st');
let cleanBlob = null, cleanName = '', prevUrl = null;

drop.onclick = () => fileInp.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('drag'); };
drop.ondragleave = () => drop.classList.remove('drag');
drop.ondrop = e => {
  e.preventDefault(); drop.classList.remove('drag');
  if (e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]);
};
fileInp.onchange = () => { if (fileInp.files[0]) processFile(fileInp.files[0]); };

clrBtn.onclick = () => {
  cleanBlob = null; fileInp.value = '';
  metaBox.hidden = true; metaBox.innerHTML = '';
  box.innerHTML = '<span>Podgląd zdjęcia</span>';
  dlBtn.disabled = true; clrBtn.disabled = true; st.textContent = '';
};

dlBtn.onclick = () => {
  if (!cleanBlob) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(cleanBlob);
  a.download = cleanName;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

async function processFile(file) {
  st.textContent = 'Analizowanie...';
  const buf = await file.arrayBuffer();
  const info = scanExif(new DataView(buf));

  metaBox.innerHTML = '';
  const rows = [
    ['Nazwa pliku', file.name],
    ['Rozmiar oryginału', (file.size / 1024).toFixed(1) + ' KB'],
    ['Metadane', info.hasMeta ? 'Wykryto (' + info.tags.join(', ') + ')' : 'Nie wykryto'],
    ['Urządzenie', info.device || 'Brak danych'],
    ['Dane GPS', info.gps ? 'TAK (ryzyko wycieku lokalizacji)' : 'Nie wykryto']
  ];
  rows.forEach(([k, v]) => {
    const d = document.createElement('div');
    d.innerHTML = `<span>${k}</span><span>${v}</span>`;
    metaBox.appendChild(d);
  });
  metaBox.hidden = false;

  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);

    const outType = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
    const ext = outType === 'image/png' ? '.png' : '.jpg';
    cleanName = file.name.replace(/\.[^.]+$/, '') + '_clean' + ext;

    canvas.toBlob(blob => {
      cleanBlob = blob;
      URL.revokeObjectURL(url);
      if (prevUrl) URL.revokeObjectURL(prevUrl);
      prevUrl = URL.createObjectURL(blob);
      box.innerHTML = `<div class="prev-wrap"><img src="${prevUrl}" alt=""><small>${img.naturalWidth}×${img.naturalHeight} px • ${(blob.size / 1024).toFixed(1)} KB</small></div>`;
      dlBtn.disabled = false;
      clrBtn.disabled = false;
      st.textContent = 'Metadane usunięte. Plik gotowy do pobrania.';
    }, outType, 0.94);
  };
  img.src = url;
}

/* czyta tagi TIFF/EXIF: wskaźnik GPS (0x8825), producent i model aparatu */
function tiff(v, s) {
  const le = v.getUint16(s) === 0x4949, u16 = o => v.getUint16(o, le), u32 = o => v.getUint32(o, le), r = {};
  if (u16(s + 2) !== 42) return r;
  const o = s + u32(s + 4), n = u16(o);
  const str = e => { const c = u32(e + 4), p = c > 4 ? s + u32(e + 8) : e + 8; let t = ''; for (let i = 0; i < c - 1 && p + i < v.byteLength; i++) t += String.fromCharCode(v.getUint8(p + i)); return t.trim(); };
  for (let i = 0; i < n; i++) {
    const e = o + 2 + i * 12; if (e + 12 > v.byteLength) break;
    const t = u16(e);
    if (t === 0x8825) r.gps = true;
    if (t === 0x010F) r.make = str(e);
    if (t === 0x0110) r.model = str(e);
  }
  return r;
}

function scanExif(v) {
  const out = { hasMeta: false, gps: false, tags: [], device: '' };
  const add = t => { out.hasMeta = true; if (!out.tags.includes(t)) out.tags.push(t); };
  const merge = r => { if (r.gps) out.gps = true; if (r.make || r.model) out.device = [r.make, r.model].filter(Boolean).join(' '); };
  const ascii = (o, n) => { let t = ''; for (let i = 0; i < n && o + i < v.byteLength; i++) t += String.fromCharCode(v.getUint8(o + i)); return t; };
  try {
    if (v.getUint16(0) === 0xFFD8) {                       // JPEG
      let o = 2;
      while (o + 4 < v.byteLength) {
        const m = v.getUint16(o);
        if (m === 0xFFDA || (m & 0xFF00) !== 0xFF00) break; // początek obrazu
        const len = v.getUint16(o + 2);
        if (m === 0xFFE1) {
          if (ascii(o + 4, 6) === 'Exif\0\0') { add('EXIF'); merge(tiff(v, o + 10)); }
          else if (ascii(o + 4, 24).startsWith('http://ns.adobe.com/xap')) { add('XMP'); if (ascii(o + 4, Math.min(len, 60000)).includes('GPSLatitude')) out.gps = true; }
        } else if (m === 0xFFED) add('IPTC');
        o += 2 + len;
      }
    } else if (ascii(1, 3) === 'PNG') {                    // PNG
      let o = 8;
      while (o + 12 <= v.byteLength) {
        const len = v.getUint32(o), t = ascii(o + 4, 4);
        if (t === 'eXIf') { add('EXIF'); merge(tiff(v, o + 8)); }
        else if (t === 'iTXt' && ascii(o + 8, 17) === 'XML:com.adobe.xmp') add('XMP');
        else if (t === 'IDAT') break;
        o += 12 + len;
      }
    } else if (ascii(0, 4) === 'RIFF' && ascii(8, 4) === 'WEBP') { // WebP
      let o = 12;
      while (o + 8 <= v.byteLength) {
        const t = ascii(o, 4), len = v.getUint32(o + 4, true);
        if (t === 'EXIF') { add('EXIF'); let s = o + 8; if (ascii(s, 6) === 'Exif\0\0') s += 6; merge(tiff(v, s)); }
        else if (t === 'XMP ') add('XMP');
        o += 8 + len + (len & 1);
      }
    }
  } catch (err) {}
  return out;
}
</script>
</body>
</html>
