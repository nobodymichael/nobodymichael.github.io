<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FBF9F4">
<title>konwerter — nobodymichael</title>
<link rel="stylesheet" href="../style.css">
<script src="../site.js"></script>
<style>
.drop{border:2px dashed var(--line);border-radius:20px;padding:2rem 1rem;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;background:var(--field);margin-bottom:1.25rem}
.drop:hover,.drop.drag{border-color:var(--red);background:rgba(245,50,44,.08)}
input[type=range]{width:100%;accent-color:var(--red);cursor:pointer}
input[type=number]{width:100%;font:inherit;padding:.7rem;border:1px solid var(--edge);border-radius:14px;background:var(--field);color:var(--ink)}
.prev-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;gap:.6rem}
.prev-wrap img{max-width:100%;max-height:14rem;border-radius:14px;object-fit:contain}
.badge{padding:.35rem .75rem;border-radius:999px;background:var(--field);border:1px solid var(--edge);font-size:.85rem;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<header><a class="brand" href="../">nobodymichael</a></header>
<main>
<h1>konwerter</h1>
<p class="lead">Zmienia format (WebP, JPG, PNG), skaluje rozdzielczość i zmniejsza wagę pliku bez wysyłania na serwer.</p>

<div class="qrgrid">
  <div>
    <div class="drop" id="drop">
      <strong>Wybierz lub upuść obraz</strong>
      <p class="hint" id="fname">Obsługuje JPG, PNG, WebP, GIF, BMP</p>
      <input type="file" id="file" accept="image/*" hidden>
    </div>

    <div class="f">
      <p class="field">Format wyjściowy</p>
      <div class="chips" id="fmt">
        <input type="radio" name="f" id="f_webp" value="image/webp" checked><label for="f_webp">WebP</label>
        <input type="radio" name="f" id="f_jpeg" value="image/jpeg"><label for="f_jpeg">JPG</label>
        <input type="radio" name="f" id="f_png" value="image/png"><label for="f_png">PNG</label>
      </div>
    </div>

    <div class="f" id="qbox">
      <label class="field" for="qual">Jakość kompresji: <span id="qval">85%</span></label>
      <input type="range" id="qual" min="10" max="100" value="85">
    </div>

    <div class="f">
      <label class="field" for="maxw">Maksymalna szerokość w px (opcjonalnie)</label>
      <input type="number" id="maxw" placeholder="Zostaw puste, aby zachować oryginał" min="16" max="10000">
    </div>

    <div class="row">
      <button class="btn" id="dl" type="button" disabled>Pobierz plik</button>
    </div>
    <p class="status" id="st"></p>
  </div>

  <div class="qr" id="box">
    <span>Podgląd wyniku</span>
  </div>
</div>
</main>
</div>
<footer class="wrap">Bez śledzenia i zewnętrznych skryptów. <a href="https://github.com/nobodymichael">GitHub</a></footer>

<script>
const $ = id => document.getElementById(id);
const drop = $('drop'), fileInp = $('file'), qual = $('qual'), qval = $('qval'), maxw = $('maxw'), dlBtn = $('dl'), box = $('box'), st = $('st');
let srcImg = null, origSize = 0, origName = '', outBlob = null, outName = '';

drop.onclick = () => fileInp.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('drag'); };
drop.ondragleave = () => drop.classList.remove('drag');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('drag'); if (e.dataTransfer.files[0]) load(e.dataTransfer.files[0]); };
fileInp.onchange = () => { if (fileInp.files[0]) load(fileInp.files[0]); };

document.querySelectorAll('input[name="f"]').forEach(r => r.onchange = () => {
  $('qbox').hidden = r.value === 'image/png';
  render();
});
qual.oninput = () => { qval.textContent = qual.value + '%'; render(); };
maxw.oninput = render;

dlBtn.onclick = () => {
  if (!outBlob) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(outBlob);
  a.download = outName;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

function load(file) {
  origSize = file.size;
  origName = file.name.replace(/\.[^.]+$/, '');
  $('fname').textContent = `${file.name} (${(origSize / 1024).toFixed(1)} KB)`;
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = () => { srcImg = img; URL.revokeObjectURL(url); render(); };
  img.src = url;
}

function render() {
  if (!srcImg) return;
  const mime = document.querySelector('input[name="f"]:checked').value;
  const ext = mime === 'image/webp' ? '.webp' : mime === 'image/png' ? '.png' : '.jpg';
  outName = origName + ext;

  let w = srcImg.naturalWidth, h = srcImg.naturalHeight;
  const limit = parseInt(maxw.value, 10);
  if (limit > 0 && w > limit) {
    h = Math.round(h * (limit / w));
    w = limit;
  }

  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  if (mime === 'image/jpeg') {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);
  }
  ctx.drawImage(srcImg, 0, 0, w, h);

  canvas.toBlob(blob => {
    outBlob = blob;
    const diff = (((blob.size - origSize) / origSize) * 100).toFixed(0);
    const sign = diff > 0 ? '+' : '';
    const prevUrl = URL.createObjectURL(blob);
    box.innerHTML = `<div class="prev-wrap"><img src="${prevUrl}" alt=""><span class="badge">${(blob.size / 1024).toFixed(1)} KB (${sign}${diff}%)</span><small>${w}×${h} px</small></div>`;
    dlBtn.disabled = false;
    st.textContent = 'Gotowe do pobrania.';
  }, mime, qual.value / 100);
}
</script>
</body>
</html>
