<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FBF9F4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23191919'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23F5322C'/%3E%3C/svg%3E">
<title>qrgen | nobodymichael</title>
<link rel="stylesheet" href="../style.css">
<script src="../site.js"></script>
<style>
.qgrid{display:grid;gap:1.25rem;margin:1.5rem 0;grid-template-areas:"in" "out" "opt"}
@media(min-width:48rem){.qgrid{grid-template-columns:1fr 22rem;grid-template-areas:"in out" "opt out";align-items:start}}
.qgrid>*{animation:rise .6s both}.qgrid>.q-out{animation-delay:.1s}.qgrid>.q-opt{animation-delay:.2s}
.q-in{grid-area:in}.q-out{grid-area:out}.q-opt{grid-area:opt}
.glass{padding:1.25rem;border:1px solid var(--edge);border-radius:28px;background:linear-gradient(135deg,var(--sheen),transparent 45%),var(--glass);-webkit-backdrop-filter:blur(34px) saturate(200%);backdrop-filter:blur(34px) saturate(200%);box-shadow:inset 0 1.5px 0 var(--edge),inset 0 -1px 0 var(--edge),0 16px 40px var(--sh);color:var(--ink)}
.q-out .qr{width:min(100%,22rem);margin-inline:auto}
.q-out .row{justify-content:center;margin:1rem 0 0}
.q-out .row .btn{flex:1 1 8rem}
@media(max-width:47.99rem){.q-out .qr{width:min(100%,19rem)}.qr.empty{aspect-ratio:auto;min-height:6rem}}
.q-in .status{margin:.6rem 0 0}
summary{cursor:pointer;font-weight:700;margin-top:1.25rem;padding:.25rem 0}
summary:hover{color:var(--red)}
.colors{display:flex;flex-wrap:wrap;gap:1rem;align-items:flex-end;margin-top:.75rem}
.colors .field{margin-bottom:.4rem}
input[type=color]{width:3.4rem;height:3rem;padding:.15rem;border:1px solid var(--edge);border-radius:14px;background:var(--field);cursor:pointer;display:block}
</style>
</head>
<body>
<div class="wrap">
<header><a class="brand" href="../">nobodymichael</a></header>
<main>
<h1>qrgen</h1>
<p class="lead">Wpisz tekst lub link, a kod pojawi się od razu.</p>
<div class="qgrid">
<section class="q-in glass">
<label class="field" for="in">Tekst lub link</label>
<textarea id="in" autofocus spellcheck="false"></textarea>
<p class="status" id="status" aria-live="polite"></p>
</section>
<section class="q-out">
<div class="qr empty" id="qr">Kod pojawi się tutaj.</div>
<div class="row">
<button class="btn" id="png" disabled>Pobierz PNG</button>
<button class="btn ghost" id="svg" disabled>Pobierz SVG</button>
</div>
</section>
<section class="q-opt glass">
<p class="field">Format</p>
<div id="fmt" class="chips cards" role="radiogroup"></div>
<details>
<summary>Własne kolory</summary>
<div class="colors">
<div><label class="field" for="ink">Kod</label><input type="color" id="ink" value="#191919"></div>
<div><label class="field" for="paper">Tło</label><input type="color" id="paper" value="#FBF9F4"></div>
<button class="btn ghost small" id="reset" type="button">Domyślne</button>
</div>
</details>
</section>
</div>
</main>
</div>
<footer class="wrap">Kod powstaje lokalnie w przeglądarce. Nic nie jest wysyłane.</footer>
<script src="../qrcode.js"></script>
<script>
(function(){
  const $=i=>document.getElementById(i), INK0="#191919", PAP0="#FBF9F4";
  qrcode.stringToBytes=qrcode.stringToBytesFuncs["UTF-8"];
  const inp=$("in"), box=$("qr"), status=$("status"), fmtEl=$("fmt"), png=$("png"), svgB=$("svg"), ink=$("ink"), paper=$("paper");
  let fmt="qr", cur=null, animate=true, ov=null;
  const C=()=>ov||{i:ink.value,p:paper.value};

  const NATIVE=[["qr","QR"],["code128","Code 128"],["ean13","EAN-13"]];
  const BW=[["azteccode","Aztec"],["datamatrix","Data Matrix"],["pdf417","PDF417"],["microqrcode","Micro QR"],["code39","Code 39"]];
  const SAMPLE={qr:"nobodymichael",code128:"qrgen",ean13:"590123412345",azteccode:"nobodymichael",datamatrix:"nobodymichael",pdf417:"nobodymichael",microqrcode:"12345",code39:"QRGEN"};
  const two=f=>f!=="code128"&&f!=="ean13"&&f!=="code39";

  /* blokada znaków zależna od formatu */
  function rule(){
    if(fmt==="ean13") return {bad:/\D/g,max:13,mode:"numeric",ph:"12 lub 13 cyfr"};
    if(fmt==="code39") return {bad:/[^A-Z0-9 \-.$\/+%]/g,up:1,ph:"A-Z, 0-9 i - . $ / + %"};
    if(fmt==="code128") return {bad:/[^\x20-\x7e]/g};
    return null;
  }
  function sanitize(){
    const r=rule(); if(!r) return;
    let v=inp.value; if(r.up) v=v.toUpperCase(); v=v.replace(r.bad,""); if(r.max) v=v.slice(0,r.max);
    if(v!==inp.value){inp.value=v; inp.classList.remove("deny"); void inp.offsetWidth; inp.classList.add("deny");}
  }
  function setRule(){const r=rule(); inp.inputMode=r&&r.mode||"text"; inp.placeholder=r&&r.ph||""; sanitize();}

  /* link: dopisz https:// gdy to sama domena */
  const DOMAIN=/^(?:(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}|localhost|\d{1,3}(?:\.\d{1,3}){3})(?::\d{1,5})?(?:[\/?#]\S*)?$/i;
  function compose(){
    const raw=inp.value, t=raw.trim();
    if(!t) return {text:"",kind:"empty"};
    if(!two(fmt)) return {text:raw,kind:"text"};
    if(/\s/.test(t)) return {text:raw,kind:"text"};
    if(/^https?:\/\//i.test(t)) return {text:t,kind:"link"};
    if(DOMAIN.test(t)) return {text:"https://"+t,kind:"linkAdded"};
    return {text:t,kind:"text"};
  }

  /* generatory SVG */
  const wrap=(w,h,d,x)=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges"><rect width="${w}" height="${h}" fill="${C().p}"/><path d="${d}" fill="${C().i}"/>${x||""}</svg>`;
  function barSvg(bits,label){
    const qz=10, top=6, bh=56; let d="", i=0;
    while(i<bits.length){ if(bits[i]==="1"){let j=i; while(bits[j]==="1") j++; d+=`M${qz+i} ${top}h${j-i}v${bh}h-${j-i}z`; i=j;} else i++; }
    const w=bits.length+qz*2, lab=label.replace(/&/g,"&amp;").replace(/</g,"&lt;");
    return wrap(w,top+bh+16,d,`<text x="${w/2}" y="${top+bh+12}" text-anchor="middle" font-family="monospace" font-size="9" fill="${C().i}" shape-rendering="auto">${lab}</text>`);
  }
  const C128="212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 114131 311141 411131 211412 211214 211232 2331112".split(" ");
  function code128(t){
    if(!/^[\x20-\x7e]+$/.test(t)) throw {pl:"Code 128 obsługuje tutaj tylko znaki ASCII."};
    const codes=[104]; let sum=104, bits="";
    for(let i=0;i<t.length;i++){const v=t.charCodeAt(i)-32; codes.push(v); sum+=v*(i+1);}
    codes.push(sum%103,106);
    codes.forEach(c=>{let on=true; for(const n of C128[c]){bits+=(on?"1":"0").repeat(+n); on=!on;}});
    return barSvg(bits,t);
  }
  const L=["0001101","0011001","0010011","0111101","0100011","0110001","0101111","0111011","0110111","0001011"];
  const PAR=["LLLLLL","LLGLGG","LLGGLG","LLGGGL","LGLLGG","LGGLLG","LGGGLL","LGLGLG","LGLGGL","LGGLGL"];
  const comp=s=>s.replace(/[01]/g,c=>c==="1"?"0":"1");
  function ean13(t){
    if(!/^\d{12,13}$/.test(t)) throw {pl:"EAN-13: podaj 12 lub 13 cyfr."};
    let s=0; for(let i=0;i<12;i++) s+=(+t[i])*(i%2?3:1);
    const chk=(10-s%10)%10;
    if(t.length===13&&+t[12]!==chk) throw {pl:"Zła cyfra kontrolna. Powinna być "+chk+"."};
    t=t.slice(0,12)+chk;
    const par=PAR[+t[0]]; let bits="101";
    for(let i=1;i<=6;i++){const l=L[+t[i]]; bits+=par[i-1]==="L"?l:[...comp(l)].reverse().join("");}
    bits+="01010";
    for(let i=7;i<=12;i++) bits+=comp(L[+t[i]]);
    return barSvg(bits+"101",t);
  }
  function makeSvg(f,text){
    if(f==="qr") return nmQr(text,{ink:C().i,paper:C().p});
    if(f==="code128") return code128(text);
    if(f==="ean13") return ean13(text);
    const o={bcid:f,text,scale:3,barcolor:C().i.slice(1),backgroundcolor:C().p.slice(1),paddingwidth:8,paddingheight:8};
    if(f==="code39") o.includetext=true;
    return bwipjs.toSVG(o);
  }

  /* kontrast kolorów */
  function lum(h){const c=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(x=>x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4)); return .2126*c[0]+.7152*c[1]+.0722*c[2];}
  function warn(){
    const a=lum(ink.value), b=lum(paper.value), r=(Math.max(a,b)+.05)/(Math.min(a,b)+.05);
    return r<3?"Za mały kontrast, kod może się nie zeskanować.":a>b?"Odwrócone kolory: nie każdy czytnik odczyta taki kod.":"";
  }

  function empty(msg){box.classList.remove("scan"); box.classList.add("empty"); box.textContent=msg;}
  function render(){
    const info=compose(); cur=null; png.disabled=svgB.disabled=true; status.textContent="";
    if(info.kind==="empty"){empty("Kod pojawi się tutaj."); animate=true; return;}
    try{cur=makeSvg(fmt,info.text);}catch(e){empty("Nie da się utworzyć kodu."); status.textContent=e.pl||"Za dużo tekstu albo znaki niedozwolone w tym formacie."; return;}
    box.classList.remove("empty"); box.innerHTML=cur; png.disabled=svgB.disabled=false;
    if(animate){box.classList.remove("scan"); void box.offsetWidth; box.classList.add("scan"); animate=false;}
    status.textContent=info.kind==="linkAdded"?"Wykryto link, dodano https://: "+info.text:warn()||(info.kind==="link"?"Wykryto link.":"");
  }
  box.addEventListener("animationend",e=>{if(e.target===box) box.classList.remove("scan");});

  /* eksport */
  function save(blob,name){
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }
  const dims=s=>{const m=/viewBox=["']\s*[\d.-]+[\s,]+[\d.-]+[\s,]+([\d.]+)[\s,]+([\d.]+)/.exec(s); return m?[+m[1],+m[2]]:[300,300];};
  svgB.onclick=()=>{if(cur) save(new Blob([cur],{type:"image/svg+xml"}),"kod.svg");};
  png.onclick=()=>{
    if(!cur) return;
    const [w,h]=dims(cur), k=Math.max(1,1200/Math.max(w,h)), W=Math.round(w*k), H=Math.round(h*k);
    const s=cur.replace(/<svg[^>]*>/,m=>m.replace(/\s(width|height)=("[^"]*"|'[^']*')/g,"").replace("<svg",`<svg width="${W}" height="${H}"`));
    const img=new Image(), url=URL.createObjectURL(new Blob([s],{type:"image/svg+xml"}));
    img.onload=()=>{const cv=document.createElement("canvas"); cv.width=W; cv.height=H; cv.getContext("2d").drawImage(img,0,0,W,H); URL.revokeObjectURL(url); cv.toBlob(b=>save(b,"kod.png"),"image/png");};
    img.src=url;
  };

  /* przyciski formatów z miniaturami */
  function thumb(f){ov={i:INK0,p:"#FFFFFF"}; let s=""; try{s=makeSvg(f,SAMPLE[f]);}catch(e){} ov=null; return s;}
  function addFormats(list){
    list.forEach(([v,n])=>{
      const r=document.createElement("input"), l=document.createElement("label");
      r.type="radio"; r.name="fmt"; r.id="fmt_"+v; r.checked=v===fmt;
      r.onchange=()=>{fmt=v; animate=true; setRule(); render();};
      l.htmlFor=r.id; l.innerHTML=`<span class="th">${thumb(v)}</span><span>${n}</span>`;
      fmtEl.append(r,l);
    });
  }

  inp.addEventListener("input",()=>{sanitize(); render();});
  [ink,paper].forEach(e=>e.addEventListener("input",render));
  $("reset").onclick=()=>{ink.value=INK0; paper.value=PAP0; render();};

  addFormats(NATIVE);
  const sc=document.createElement("script"); sc.src="bwip-js-min.js";
  sc.onload=()=>{if(window.bwipjs&&bwipjs.toSVG) addFormats(BW);};
  document.head.appendChild(sc);
  setRule(); render();
})();
</script>
</body>
</html>
