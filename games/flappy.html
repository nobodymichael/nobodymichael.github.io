<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flappy Bird: Hardcore Edition | nobodymichael</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #090a0f;
            color: #f3f4f6;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        .glow-red {
            box-shadow: 0 0 30px rgba(245, 50, 44, 0.4);
        }

        .glow-box {
            box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.85);
        }

        canvas {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        .diff-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .diff-btn.active-normal {
            background-color: #10b981;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
            border-color: #34d399;
        }

        .diff-btn.active-hard {
            background-color: #f59e0b;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
            border-color: #fbbf24;
        }

        .diff-btn.active-brutal {
            background-color: #ef4444;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
            border-color: #f87171;
            animation: pulse-border 1.5s infinite;
        }

        @keyframes pulse-border {
            0%, 100% { border-color: #ef4444; }
            50% { border-color: #fca5a5; }
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center p-2 sm:p-4 select-none">

    <div class="relative w-full max-w-[420px] h-full max-h-[740px] flex flex-col bg-[#111218] rounded-2xl overflow-hidden border border-white/10 shadow-2xl">

        <!-- Top Navigation / Stats Bar -->
        <header class="absolute top-0 left-0 right-0 z-20 flex items-center justify-between p-4 bg-gradient-to-b from-black/80 via-black/40 to-transparent pointer-events-none">
            <div class="flex items-center gap-2 pointer-events-auto">
                <a href="./" class="h-10 px-3 rounded-xl bg-white/10 hover:bg-white/20 border border-white/10 flex items-center justify-center gap-1.5 text-xs font-extrabold text-white backdrop-blur-md transition-all active:scale-95" title="Wróć do Games Hub">
                    <span>&lt;</span>
                    <span>Games Hub</span>
                </a>
                <a href="../" class="w-10 h-10 rounded-xl bg-white/10 hover:bg-white/20 border border-white/10 flex items-center justify-center text-xs font-extrabold text-white/80 hover:text-white backdrop-blur-md transition-all active:scale-95" title="Strona główna">
                    ⌂
                </a>
                <button id="muteBtn" class="w-10 h-10 rounded-xl bg-white/10 hover:bg-white/20 border border-white/10 flex items-center justify-center text-white backdrop-blur-md transition-all active:scale-95" aria-label="Przełącz dźwięk">
                    <svg id="soundOnIcon" class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                    </svg>
                    <svg id="soundOffIcon" class="w-5 h-5 fill-current hidden text-red-400" viewBox="0 0 24 24">
                        <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                    </svg>
                </button>
            </div>

            <div class="flex flex-col items-end">
                <span id="hudDiffBadge" class="px-2.5 py-0.5 mb-1 rounded-lg bg-red-500/20 border border-red-500/40 text-red-400 font-extrabold text-[10px] uppercase tracking-wider backdrop-blur-md">
                    HARD
                </span>
                <span id="currentScore" class="text-2xl font-black leading-none tracking-wider text-white drop-shadow-md">0</span>
                <span class="text-[10px] uppercase tracking-widest text-white/50 font-bold">Best: <span id="highScoreText">0</span></span>
            </div>
        </header>

        <div id="windAlert" class="absolute top-20 left-1/2 -translate-x-1/2 z-20 pointer-events-none opacity-0 transition-opacity duration-300 flex items-center gap-1.5 px-3 py-1 rounded-full bg-cyan-500/20 border border-cyan-400/40 text-cyan-300 text-xs font-bold backdrop-blur-md">
            <span>🌪️ PODMUCH WIATRU</span>
        </div>

        <div id="gameWrapper" class="relative flex-1 w-full h-full cursor-pointer overflow-hidden">
            <canvas id="gameCanvas" class="w-full h-full block"></canvas>

            <!-- Start Screen -->
            <div id="startOverlay" class="absolute inset-0 z-10 flex flex-col items-center justify-center p-6 text-center bg-black/50 backdrop-blur-[3px] transition-opacity duration-300">
                <div class="w-16 h-16 mb-3 rounded-2xl bg-[#F5322C]/20 border border-[#F5322C]/40 flex items-center justify-center glow-red animate-bounce">
                    <svg class="w-8 h-8 text-[#F5322C]" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
                    </svg>
                </div>

                <h1 class="text-3xl font-black tracking-tight text-white mb-1">FLAPPY BIRD</h1>
                <span class="text-xs font-bold uppercase tracking-widest text-[#F5322C] mb-5">Hardcore Edition</span>

                <div class="w-full max-w-[290px] bg-white/5 border border-white/10 p-1.5 rounded-xl flex gap-1 mb-6">
                    <button type="button" data-diff="normal" class="diff-btn flex-1 py-2 rounded-lg text-xs font-extrabold border border-transparent text-white/60 hover:text-white">
                        NORMAL
                    </button>
                    <button type="button" data-diff="hard" class="diff-btn active-hard flex-1 py-2 rounded-lg text-xs font-extrabold border border-transparent text-white">
                        HARD
                    </button>
                    <button type="button" data-diff="brutal" class="diff-btn flex-1 py-2 rounded-lg text-xs font-extrabold border border-transparent text-white/60 hover:text-white">
                        BRUTAL
                    </button>
                </div>

                <p class="text-xs text-white/70 font-medium max-w-[260px] leading-relaxed mb-6">
                    Kliknij lub naciśnij <kbd class="px-2 py-0.5 bg-white/20 rounded text-[11px] text-white">Spacja</kbd>, aby wystartować.
                </p>

                <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white/10 border border-white/10 text-xs font-semibold text-white/90">
                    <span class="w-2 h-2 rounded-full bg-[#F5322C] animate-ping"></span>
                    Przygotuj szybki refleks!
                </div>
            </div>

            <!-- Game Over Screen -->
            <div id="gameOverOverlay" class="absolute inset-0 z-10 flex flex-col items-center justify-center p-6 text-center bg-black/80 backdrop-blur-md hidden transition-all duration-300">
                <div class="w-full max-w-[290px] bg-[#181a24] border border-white/10 rounded-2xl p-6 glow-box flex flex-col items-center">
                    <span class="text-xs font-bold uppercase tracking-widest text-[#F5322C] mb-1">Koniec Gry</span>
                    <h2 class="text-2xl font-black text-white mb-4">WYNIK</h2>

                    <div class="w-full bg-white/5 rounded-xl p-4 border border-white/5 flex justify-between items-center mb-6">
                        <div class="text-left">
                            <span class="text-[11px] text-white/50 block font-semibold uppercase">Wynik</span>
                            <span id="finalScore" class="text-2xl font-black text-white">0</span>
                        </div>
                        <div class="h-8 w-[1px] bg-white/10"></div>
                        <div class="text-right">
                            <span class="text-[11px] text-white/50 block font-semibold uppercase">Najlepszy (<span id="gameOverDiffTag">HARD</span>)</span>
                            <span id="bestScore" class="text-2xl font-black text-amber-400">0</span>
                        </div>
                    </div>

                    <button id="restartBtn" type="button" class="w-full py-3.5 px-6 rounded-xl bg-[#F5322C] hover:bg-[#d92721] text-white font-bold text-sm tracking-wide shadow-lg shadow-[#F5322C]/30 active:scale-95 transition-all flex items-center justify-center gap-2 mb-2.5">
                        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                        </svg>
                        RESTART
                    </button>

                    <a href="./" class="w-full py-2.5 px-4 rounded-xl bg-white/10 hover:bg-white/15 text-white/85 font-bold text-xs tracking-wide transition-all">
                        Wróć do Games Hub
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        class AudioSynth {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                }
                if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
            }
            playJump() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(360, now);
                osc.frequency.exponentialRampToValueAtTime(750, now + 0.09);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.09);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.09);
            }
            playScore() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                [587.33, 880].forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    const startTime = now + idx * 0.06;
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, startTime);
                    gain.gain.setValueAtTime(0.2, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.1);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.1);
                });
            }
            playHit() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(280, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        const synth = new AudioSynth();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameWrapper = document.getElementById('gameWrapper');
        const startOverlay = document.getElementById('startOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const restartBtn = document.getElementById('restartBtn');
        const currentScoreEl = document.getElementById('currentScore');
        const highScoreText = document.getElementById('highScoreText');
        const finalScoreEl = document.getElementById('finalScore');
        const bestScoreEl = document.getElementById('bestScore');
        const hudDiffBadge = document.getElementById('hudDiffBadge');
        const gameOverDiffTag = document.getElementById('gameOverDiffTag');
        const windAlert = document.getElementById('windAlert');
        const muteBtn = document.getElementById('muteBtn');
        const soundOnIcon = document.getElementById('soundOnIcon');
        const soundOffIcon = document.getElementById('soundOffIcon');
        const diffBtns = document.querySelectorAll('.diff-btn');

        const LOGICAL_WIDTH = 380;
        const LOGICAL_HEIGHT = 640;
        let scale = 1;

        function resizeCanvas() {
            const rect = gameWrapper.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = Math.max(1, Math.round(rect.width * dpr));
            canvas.height = Math.max(1, Math.round(rect.height * dpr));
            scale = canvas.width / LOGICAL_WIDTH;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const STATE = { START: 0, PLAYING: 1, GAMEOVER: 2 };
        let currentState = STATE.START;
        let selectedDiff = 'hard';

        const DIFF_CONFIGS = {
            normal: { label: 'NORMAL', gap: 138, speed: 155, gravity: 1250, jump: -380, movingProb: 0.15, oscAmp: 30, color: 'text-emerald-400 bg-emerald-500/20 border-emerald-500/40' },
            hard:   { label: 'HARD',   gap: 112, speed: 195, gravity: 1500, jump: -415, movingProb: 0.50, oscAmp: 50, color: 'text-amber-400 bg-amber-500/20 border-amber-500/40' },
            brutal: { label: 'BRUTAL', gap: 92,  speed: 235, gravity: 1750, jump: -445, movingProb: 0.85, oscAmp: 75, color: 'text-red-400 bg-red-500/20 border-red-500/40' }
        };

        const getHighScore = d => parseInt(localStorage.getItem(`flappy_best_${d}`) || '0', 10);
        const setHighScore = (d, v) => localStorage.setItem(`flappy_best_${d}`, String(v));

        function updateDiffUI() {
            diffBtns.forEach(btn => {
                const d = btn.dataset.diff;
                btn.className = `diff-btn flex-1 py-2 rounded-lg text-xs font-extrabold border border-transparent ${d === selectedDiff ? `active-${d}` : 'text-white/60 hover:text-white'}`;
            });
            const cfg = DIFF_CONFIGS[selectedDiff];
            hudDiffBadge.textContent = cfg.label;
            hudDiffBadge.className = `px-2.5 py-0.5 mb-1 rounded-lg border font-extrabold text-[10px] uppercase tracking-wider backdrop-blur-md ${cfg.color}`;
            highScoreText.textContent = getHighScore(selectedDiff);
        }

        diffBtns.forEach(btn => {
            btn.addEventListener('click', e => {
                e.stopPropagation();
                selectedDiff = btn.dataset.diff;
                updateDiffUI();
            });
        });
        updateDiffUI();

        muteBtn.addEventListener('click', e => {
            e.stopPropagation();
            synth.muted = !synth.muted;
            soundOnIcon.classList.toggle('hidden', synth.muted);
            soundOffIcon.classList.toggle('hidden', !synth.muted);
        });

        let score = 0, lastTime = 0, gameTime = 0, screenShakeTime = 0;
        let windForce = 0, windTimer = 0;
        let particles = [], speedLines = [], pipes = [], pipeTimer = 0;
        let bgOffset = 0, groundOffset = 0;

        const bird = {
            x: 80, y: 300, radius: 13, velocity: 0, rotation: 0, wingPhase: 0,
            reset() {
                this.x = 80;
                this.y = LOGICAL_HEIGHT / 2 - 20;
                this.velocity = 0;
                this.rotation = 0;
                this.wingPhase = 0;
            },
            jump() {
                this.velocity = DIFF_CONFIGS[selectedDiff].jump;
                synth.playJump();
                for (let i = 0; i < 7; i++) {
                    particles.push({
                        x: this.x - 10, y: this.y + 5,
                        vx: (Math.random() - 0.5) * 50 - 40,
                        vy: (Math.random() - 0.5) * 40 + 20,
                        radius: Math.random() * 3.5 + 1.5,
                        alpha: 1,
                        color: selectedDiff === 'brutal' ? '#ef4444' : '#F5322C'
                    });
                }
            },
            update(dt) {
                const cfg = DIFF_CONFIGS[selectedDiff];
                if (currentState === STATE.PLAYING) {
                    this.velocity += (cfg.gravity + windForce) * dt;
                    this.y += this.velocity * dt;
                    this.rotation = this.velocity < 0
                        ? Math.max(-0.45, this.rotation - 5 * dt)
                        : Math.min(1.25, this.rotation + 4 * dt);
                    this.wingPhase += dt * 18;
                } else if (currentState === STATE.START) {
                    this.wingPhase += dt * 9;
                    this.y = (LOGICAL_HEIGHT / 2 - 20) + Math.sin(this.wingPhase) * 9;
                    this.rotation = 0;
                } else if (currentState === STATE.GAMEOVER) {
                    if (this.y + this.radius < LOGICAL_HEIGHT - 60) {
                        this.velocity += cfg.gravity * dt;
                        this.y += this.velocity * dt;
                        this.rotation = Math.min(1.5, this.rotation + 6 * dt);
                    }
                }
            },
            draw() {
                ctx.save();
                ctx.translate(this.x * scale, this.y * scale);
                ctx.rotate(this.rotation);
                const r = this.radius * scale;

                ctx.beginPath();
                ctx.arc(0, r * 0.3, r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.fillStyle = selectedDiff === 'brutal' ? '#ef4444' : (selectedDiff === 'hard' ? '#f59e0b' : '#F5322C');
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(r * 0.4, -r * 0.2);
                ctx.lineTo(r * 1.35, 0);
                ctx.lineTo(r * 0.4, r * 0.4);
                ctx.fillStyle = '#FFAA00';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(r * 0.3, -r * 0.3, r * 0.35, 0, Math.PI * 2);
                ctx.fillStyle = '#FFFFFF';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(r * 0.45, -r * 0.3, r * 0.15, 0, Math.PI * 2);
                ctx.fillStyle = '#111111';
                ctx.fill();

                const wingOffsetY = Math.sin(this.wingPhase) * (r * 0.35);
                ctx.beginPath();
                ctx.ellipse(-r * 0.3, wingOffsetY, r * 0.5, r * 0.3, -0.25, 0, Math.PI * 2);
                ctx.fillStyle = '#B91C1C';
                ctx.fill();
                ctx.restore();
            }
        };

        const getCurrentSpeed = () => DIFF_CONFIGS[selectedDiff].speed + Math.min(60, score * 2.5);
        const getCurrentGap = () => Math.max(78, DIFF_CONFIGS[selectedDiff].gap - Math.min(18, Math.floor(score / 3)));

        function spawnPipe() {
            const cfg = DIFF_CONFIGS[selectedDiff];
            const gap = getCurrentGap();
            const minH = 50;
            const maxH = LOGICAL_HEIGHT - 60 - gap - 50;
            const topH = Math.floor(Math.random() * (maxH - minH + 1)) + minH;
            const isMoving = Math.random() < cfg.movingProb;
            pipes.push({
                x: LOGICAL_WIDTH,
                baseTopHeight: topH,
                topHeight: topH,
                gap,
                bottomY: topH + gap,
                passed: false,
                isMoving,
                oscAmp: isMoving ? Math.min(cfg.oscAmp, (LOGICAL_HEIGHT - 120 - gap) / 3) : 0,
                oscSpeed: isMoving ? (1.5 + Math.random() * 1.5) : 0,
                oscPhase: Math.random() * Math.PI * 2
            });
        }

        function checkCollision() {
            if (bird.y + bird.radius >= LOGICAL_HEIGHT - 60 || bird.y - bird.radius <= 0) return true;
            const pw = 58;
            for (const p of pipes) {
                if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + pw) {
                    if (bird.y - bird.radius < p.topHeight || bird.y + bird.radius > p.bottomY) return true;
                }
            }
            return false;
        }

        function startGame() {
            score = 0;
            currentScoreEl.textContent = '0';
            pipes = [];
            particles = [];
            speedLines = [];
            pipeTimer = 0.8;
            windForce = 0;
            windTimer = 3;
            windAlert.style.opacity = '0';
            bird.reset();
            currentState = STATE.PLAYING;
            startOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            bird.jump();
        }

        function triggerGameOver() {
            if (currentState === STATE.GAMEOVER) return;
            currentState = STATE.GAMEOVER;
            windForce = 0;
            windAlert.style.opacity = '0';
            screenShakeTime = 0.25;
            synth.playHit();

            const best = Math.max(score, getHighScore(selectedDiff));
            setHighScore(selectedDiff, best);
            highScoreText.textContent = best;
            finalScoreEl.textContent = score;
            bestScoreEl.textContent = best;
            gameOverDiffTag.textContent = DIFF_CONFIGS[selectedDiff].label;
            gameOverOverlay.classList.remove('hidden');
        }

        function handleInput() {
            if (currentState === STATE.START) startGame();
            else if (currentState === STATE.PLAYING) bird.jump();
        }

        gameWrapper.addEventListener('pointerdown', e => {
            if (e.target.closest('button, a')) return;
            handleInput();
        });
        restartBtn.addEventListener('click', e => {
            e.stopPropagation();
            startGame();
        });
        window.addEventListener('keydown', e => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                if (currentState === STATE.GAMEOVER) startGame();
                else handleInput();
            }
        });

        function update(dt) {
            gameTime += dt;
            const spd = getCurrentSpeed();
            bgOffset = (bgOffset + dt * 25) % LOGICAL_WIDTH;
            if (currentState !== STATE.GAMEOVER) {
                groundOffset = (groundOffset + dt * spd) % LOGICAL_WIDTH;
            }
            if (screenShakeTime > 0) screenShakeTime = Math.max(0, screenShakeTime - dt);

            if (currentState === STATE.PLAYING) {
                if (selectedDiff !== 'normal') {
                    windTimer -= dt;
                    if (windTimer <= 0) {
                        if (windForce === 0) {
                            windForce = (Math.random() < 0.5 ? -1 : 1) * (selectedDiff === 'brutal' ? 380 : 220);
                            windTimer = 2.2;
                            windAlert.style.opacity = '1';
                        } else {
                            windForce = 0;
                            windTimer = 4 + Math.random() * 3;
                            windAlert.style.opacity = '0';
                        }
                    }
                }

                pipeTimer -= dt;
                if (pipeTimer <= 0) {
                    spawnPipe();
                    pipeTimer = Math.max(1.05, 220 / spd);
                }

                for (let i = pipes.length - 1; i >= 0; i--) {
                    const p = pipes[i];
                    p.x -= spd * dt;
                    if (p.isMoving) {
                        const offset = Math.sin(gameTime * p.oscSpeed + p.oscPhase) * p.oscAmp;
                        p.topHeight = Math.max(40, Math.min(LOGICAL_HEIGHT - 60 - p.gap - 40, p.baseTopHeight + offset));
                        p.bottomY = p.topHeight + p.gap;
                    }
                    if (!p.passed && p.x + 58 < bird.x) {
                        p.passed = true;
                        score++;
                        currentScoreEl.textContent = score;
                        synth.playScore();
                    }
                    if (p.x < -70) pipes.splice(i, 1);
                }

                if (checkCollision()) triggerGameOver();
            }

            bird.update(dt);

            for (let i = particles.length - 1; i >= 0; i--) {
                const pt = particles[i];
                pt.x += pt.vx * dt;
                pt.y += pt.vy * dt;
                pt.alpha -= dt * 2.8;
                if (pt.alpha <= 0) particles.splice(i, 1);
            }
            if (currentState === STATE.PLAYING && (selectedDiff === 'brutal' || score >= 10) && Math.random() < 0.4) {
                speedLines.push({
                    x: LOGICAL_WIDTH + 20,
                    y: Math.random() * (LOGICAL_HEIGHT - 80),
                    length: Math.random() * 40 + 20,
                    speed: spd * 1.6,
                    alpha: Math.random() * 0.3 + 0.1
                });
            }
            for (let i = speedLines.length - 1; i >= 0; i--) {
                const sl = speedLines[i];
                sl.x -= sl.speed * dt;
                if (sl.x < -sl.length) speedLines.splice(i, 1);
            }
        }

        function draw() {
            const w = canvas.width, h = canvas.height;
            ctx.save();
            if (screenShakeTime > 0) {
                const mag = 6 * scale * (screenShakeTime / 0.25);
                ctx.translate((Math.random() - 0.5) * mag, (Math.random() - 0.5) * mag);
            }

            const sky = ctx.createLinearGradient(0, 0, 0, h);
            sky.addColorStop(0, '#0a0b12');
            sky.addColorStop(0.7, '#131625');
            sky.addColorStop(1, '#1b1f33');
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, w, h);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.025)';
            for (let i = -1; i < LOGICAL_WIDTH / 40 + 2; i++) {
                const x = (i * 40 - bgOffset * 0.4) * scale;
                const bh = (70 + Math.sin(i * 1.8) * 35 + 35) * scale;
                ctx.fillRect(x, h - 60 * scale - bh, 38 * scale, bh);
            }

            pipes.forEach(p => {
                const x = p.x * scale, pw = 58 * scale, topH = p.topHeight * scale, botY = p.bottomY * scale;
                const botH = (LOGICAL_HEIGHT - 60 - p.bottomY) * scale;
                const grad = ctx.createLinearGradient(x, 0, x + pw, 0);
                if (p.isMoving) {
                    grad.addColorStop(0, '#2c223b'); grad.addColorStop(0.3, '#4d3766'); grad.addColorStop(1, '#20182b');
                } else {
                    grad.addColorStop(0, '#242938'); grad.addColorStop(0.3, '#384056'); grad.addColorStop(1, '#1b1f2b');
                }
                ctx.fillStyle = grad;
                ctx.fillRect(x, 0, pw, topH);
                ctx.fillRect(x - 4 * scale, topH - 20 * scale, pw + 8 * scale, 20 * scale);
                ctx.fillRect(x, botY, pw, botH);
                ctx.fillRect(x - 4 * scale, botY, pw + 8 * scale, 20 * scale);
            });

            const groundH = 60 * scale, groundY = h - groundH;
            ctx.fillStyle = '#11131c';
            ctx.fillRect(0, groundY, w, groundH);
            ctx.fillStyle = selectedDiff === 'brutal' ? '#ef4444' : (selectedDiff === 'hard' ? '#f59e0b' : '#F5322C');
            ctx.fillRect(0, groundY, w, 3 * scale);

            speedLines.forEach(sl => {
                ctx.strokeStyle = `rgba(255, 255, 255, ${sl.alpha})`;
                ctx.lineWidth = 1.5 * scale;
                ctx.beginPath();
                ctx.moveTo(sl.x * scale, sl.y * scale);
                ctx.lineTo((sl.x + sl.length) * scale, sl.y * scale);
                ctx.stroke();
            });

            particles.forEach(pt => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, pt.alpha);
                ctx.beginPath();
                ctx.arc(pt.x * scale, pt.y * scale, pt.radius * scale, 0, Math.PI * 2);
                ctx.fillStyle = pt.color;
                ctx.fill();
                ctx.restore();
            });

            bird.draw();
            ctx.restore();
        }

        function loop(ts) {
            if (!lastTime) lastTime = ts;
            const dt = Math.min(0.05, (ts - lastTime) / 1000);
            lastTime = ts;
            update(dt);
            draw();
            requestAnimationFrame(loop);
        }
        bird.reset();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
