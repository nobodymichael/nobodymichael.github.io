<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LEBERCUT — rozkrój płyt</title>
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="../assets/lebercut.css">
  <script defer src="../assets/site.js"></script>
  <script defer src="../assets/lebercut.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="cut-header-brand">
        <img src="../assets/lebercut-logo.png" alt="LEBERCUT" class="cut-logo">
        <span class="subtitle">Rozkrój płyt · okleina · równe cięcia</span>
      </div>
      <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap" data-cut-tabs>
        <button type="button" class="btn btn-ghost is-active" data-cut-tab="cut">Rozkrój płyt</button>
        <button type="button" class="btn btn-ghost" data-cut-tab="equal">Równe cięcia</button>
        <a href="../index.html" class="btn btn-ghost">Strona główna</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="cutView" class="cut-layout">
      <div>
        <section class="cut-panel">
          <h2 class="cut-panel-title">1. Płyta i parametry cięcia</h2>

          <div class="cut-section">
            <div class="cut-field">
              <label for="cutPreset">Materiał</label>
              <select id="cutPreset">
                <option value="meblowa">Płyta meblowa (2800 × 2070 mm, odjęcie 20 mm)</option>
                <option value="osb">Płyta OSB (2500 × 1250 mm, bez odjęcia)</option>
                <option value="custom">Własne wymiary</option>
              </select>
            </div>

            <div class="cut-row-2" style="margin-top:0.65rem">
              <div class="cut-field">
                <label for="cutSw">Szerokość (mm)</label>
                <input type="number" id="cutSw" value="2800" min="10" step="1">
              </div>
              <div class="cut-field">
                <label for="cutSh">Wysokość / dł. (mm)</label>
                <input type="number" id="cutSh" value="2070" min="10" step="1">
              </div>
            </div>
          </div>

          <div class="cut-section">
            <div class="cut-field" style="margin-bottom:0.45rem">
              <label>Odjęcie krawędzi (mm na stronę)</label>
            </div>
            <div class="cut-row-4">
              <div class="cut-field"><label for="cutTL">Lewa</label><input type="number" id="cutTL" value="20" min="0" step="1"></div>
              <div class="cut-field"><label for="cutTR">Prawa</label><input type="number" id="cutTR" value="20" min="0" step="1"></div>
              <div class="cut-field"><label for="cutTT">Góra</label><input type="number" id="cutTT" value="20" min="0" step="1"></div>
              <div class="cut-field"><label for="cutTB">Dół</label><input type="number" id="cutTB" value="20" min="0" step="1"></div>
            </div>
            <div class="cut-item-sub" id="cutUsableInfo" style="margin-top:0.45rem">Pole robocze: 2760 × 2030 mm</div>
          </div>

          <div class="cut-section">
            <div class="cut-row-2">
              <div class="cut-field">
                <label for="cutGrain">Słoje (1. wym. = poziom)</label>
                <select id="cutGrain">
                  <option value="h">Poziomo</option>
                  <option value="v">Pionowo</option>
                  <option value="none">Wcale (obrót 90°)</option>
                </select>
              </div>
              <div class="cut-field">
                <label for="cutKerf">Rzaz piły (mm)</label>
                <input type="number" id="cutKerf" value="3.2" min="0" step="0.1">
              </div>
            </div>

            <div class="cut-field" style="margin-top:0.65rem">
              <label for="cutPrice">Cena za formatkę (1 form. = 1 cięcie, zł)</label>
              <input type="number" id="cutPrice" value="5" min="0" step="0.5">
            </div>
          </div>
        </section>

        <section class="cut-panel">
          <h2 class="cut-panel-title">2. Formatki i okleina</h2>

          <div class="cut-row-3">
            <div class="cut-field"><label for="cutPW">1. wym. (mm)</label><input type="number" id="cutPW" value="800" min="1" step="1"></div>
            <div class="cut-field"><label for="cutPH">2. wym. (mm)</label><input type="number" id="cutPH" value="400" min="1" step="1"></div>
            <div class="cut-field"><label for="cutPQty">Ilość (szt.)</label><input type="number" id="cutPQty" value="4" min="1" step="1"></div>
          </div>

          <div class="cut-field" style="margin-top:0.6rem">
            <label for="cutPLabel">Opis (opcjonalnie)</label>
            <input type="text" id="cutPLabel" placeholder="np. front, półka">
          </div>

          <div class="cut-edges-box">
            <div class="cut-field"><label style="margin:0">Oklejane boki</label></div>
            <div class="cut-edges-grid">
              <label class="cut-chk"><input type="checkbox" id="edgeTop"> Góra (1. wym.)</label>
              <label class="cut-chk"><input type="checkbox" id="edgeBot"> Dół (1. wym.)</label>
              <label class="cut-chk"><input type="checkbox" id="edgeLeft"> Lewo (2. wym.)</label>
              <label class="cut-chk"><input type="checkbox" id="edgeRight"> Prawo (2. wym.)</label>
            </div>
          </div>

          <div class="cut-actions">
            <button type="button" class="btn btn-primary" id="cutAddBtn">+ Dodaj formatkę</button>
            <button type="button" class="btn btn-ghost btn-sm" id="cutSampleBtn">Przykład</button>
            <button type="button" class="btn btn-ghost btn-sm" id="cutClearBtn">Wyczyść</button>
          </div>

          <div class="cut-list" id="cutPartsList"></div>
        </section>
      </div>

      <section class="cut-panel">
        <div class="cut-print-meta" id="cutPrintMeta"></div>
        <div class="cut-panel-head" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0.5rem;margin-bottom:0.85rem;padding-bottom:0.55rem;border-bottom:1px solid var(--border, rgba(255,255,255,0.12))">
          <h2 style="margin:0;font-size:1rem;font-weight:800">Plan rozkroju i zestawienie</h2>
          <div style="display:flex;gap:0.45rem;align-items:center">
            <select id="cutPrintMode" style="width:auto;font-size:0.78rem">
              <option value="all">Druk: płyty + tabela</option>
              <option value="table">Druk: sama tabela</option>
            </select>
            <button type="button" class="btn btn-primary btn-sm" id="cutPrintBtn">Drukuj</button>
          </div>
        </div>

        <div id="cutAlerts"></div>
        <div class="cut-kpis" id="cutKpis"></div>
        <div id="cutSheetsOut"></div>
        <div class="cut-table-wrap" id="cutSummaryTable"></div>
      </section>
    </div>

    <div id="eqView" class="cut-layout" hidden>
      <section class="cut-panel">
        <h2 class="cut-panel-title">Cięcie na równe części</h2>
        <div class="cut-row-2">
          <div class="cut-field"><label for="eqLen">Długość (mm)</label><input type="number" id="eqLen" value="3000" min="1" step="1"></div>
          <div class="cut-field"><label for="eqN">Liczba części</label><input type="number" id="eqN" value="5" min="1" step="1"></div>
        </div>
        <div class="cut-row-2" style="margin-top:0.65rem">
          <div class="cut-field"><label for="eqKerf">Rzaz piły (mm)</label><input type="number" id="eqKerf" value="3.2" min="0" step="0.1"></div>
          <div class="cut-field"><label for="eqTrim">Odcięcie końców (mm)</label><input type="number" id="eqTrim" value="0" min="0" step="1"></div>
        </div>
        <div class="cut-item-sub" id="eqCutsHint" style="margin-top:0.5rem">Liczba cięć przelotowych: 4</div>
      </section>

      <section class="cut-panel">
        <h2 class="cut-panel-title">Podział długości</h2>
        <div id="eqOut"></div>
      </section>
    </div>
  </main>
</body>
</html>
