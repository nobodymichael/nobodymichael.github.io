<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d0e0f">
<title>exif cleaner — nobodymichael</title>
<link rel="stylesheet" href="../assets/style.css">
<script src="../assets/site.js"></script>
<style>
.drop{
  position:relative;overflow:hidden;
  border:2px dashed var(--line);border-radius:20px;padding:2.2rem 1rem;
  text-align:center;cursor:pointer;
  background:var(--field);transition:border-color .2s,background .2s
}
.drop:hover,.drop.drag{border-color:var(--red);background:rgba(245,50,44,.1)}

.scan-box{
  position:relative;overflow:hidden;
  width:100%;height:100%;min-height:16rem;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.65rem;
  border-radius:18px
}
.scan-box.scanning .scan-grid{opacity:1}
.scan-box.scanning .scan-beam{opacity:1;animation:beamSweep 1.15s cubic-bezier(.4,0,.2,1) infinite}
.scan-box.scanning .prev-wrap img{filter:contrast(1.15) saturate(1.25);transform:scale(1.02)}

.scan-grid{
  position:absolute;inset:0;pointer-events:none;opacity:0;
  transition:opacity .25s ease;
  background:
    linear-gradient(90deg,rgba(245,50,44,.16) 1px,transparent 1px) 0 0/18px 18px,
    linear-gradient(rgba(245,50,44,.16) 1px,transparent 1px) 0 0/18px 18px
}
.scan-beam{
  position:absolute;left:0;right:0;height:3px;top:0;opacity:0;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--red2) 35%,#fff 50%,var(--red2) 65%,transparent);
  box-shadow:0 0 18px var(--red),0 0 36px rgba(245,50,44,.65)
}
@keyframes beamSweep{
  0%{top:4%;opacity:.2}
  15%{opacity:1}
  85%{opacity:1}
  100%{top:96%;opacity:.2}
}

.hex-stream{
  width:100%;margin-top:.85rem;padding:.7rem .85rem;
  border-radius:14px;border:1.5px solid var(--edge);
  background:rgba(0,0,0,.42);
  font:700 .74rem/1.45 var(--mono);
  color:var(--muted);
  word-break:break-all;letter-spacing:.04em
}
.hex-stream .tag-hi{color:#ff6b66;text-shadow:0 0 10px rgba(245,50,44,.5)}
.hex-stream .ok-hi{color:#4ade80}

.meta{margin-top:1.15rem;font-size:.92rem;display:grid;gap:.45rem}
.meta div{
  padding:.58rem .85rem;border-radius:12px;
  background:var(--field);border:1.5px solid var(--edge);
  display:flex;justify-content:space-between;gap:1rem;
  opacity:0;transform:translateY(8px);
  animation:rowIn .28s ease forwards
}
.meta div.gps-alert{border-color:var(--red);background:rgba(245,50,44,.14)}
.meta span:last-child{font-weight:800;text-align:right;word-break:break-all}
@keyframes rowIn{
  to{opacity:1;transform:translateY(0)}
}

.prev-wrap{
  position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:100%;gap:.6rem;transition:transform .25s ease,filter .25s ease
}
.prev-wrap img{max-width:100%;max-height:14.5rem;border-radius:14px;object-fit:contain;box-shadow:0 10px 26px var(--sh)}
@media(prefers-reduced-motion:reduce){
  .scan-box.scanning .scan-beam,.meta div{animation:none;opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="wrap">
<header><a class="brand" href="../">nobodymichael</a></header>
<main>
<h1>exif cleaner</h1>
<p class="lead">Skanuje strukturę bajtów, wyciąga ukryte metadane (GPS, sprzęt, tagi) i wypala czysty plik bez śladów.</p>

<div class="qrgrid">
  <div>
    <div class="drop" id="drop">
      <strong>Kliknij lub upuść zdjęcie tutaj</strong>
      <p class="hint">JPG, PNG, WebP — wszystko dzieje się lokalnie w pamięci</p>
      <input type="file" id="file" accept="image/jpeg,image/png,image/webp" hidden>
    </div>

    <div class="hex-stream" id="hex" hidden></div>
    <div class="meta" id="meta" hidden></div>

    <div class="row">
      <button class="btn" id="dl" type="button" disabled>Pobierz czyste zdjęcie</button>
      <button class="btn ghost" id="clr" type="button" disabled>Wyczyść</button>
    </div>
    <p class="status" id="st"></p>
  </div>

  <div class="qr" id="box">
    <div class="scan-box" id="scanBox">
      <div class="scan-grid"></div>
      <div class="scan-beam"></div>
      <span id="phText">Podgląd zdjęcia</span>
    </div>
  </div>
</div>
</main>
</div>
<footer class="wrap">Bez śledzenia i zewnętrznych skryptów. <a href="https://github.com/nobodymichael">GitHub</a></footer>

<script>
const $ = id => document.getElementById(id);
const drop = $('drop'), fileInp = $('file'), metaBox = $('meta'), hexBox = $('hex');
const dlBtn = $('dl'), clrBtn = $('clr'), scanBox = $('scanBox'), st = $('st');
let cleanBlob = null, cleanName = '', prevUrl = null, animTimer = null;

const sleep = ms => new Promise(r => setTimeout(r, ms));
const HEX_POOL = '0123456789ABCDEF';
const randHex = n => Array.from({ length: n }, (_, i) => HEX_POOL[(Math.random() * 16) | 0] + ((i + 1) % 2 === 0 ? ' ' : '')).join('').trim();

drop.onclick = () => fileInp.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('drag'); };
drop.ondragleave = () => drop.classList.remove('drag');
drop.ondrop = e => {
  e.preventDefault(); drop.classList.remove('drag');
  if (e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]);
};
fileInp.onchange = () => { if (fileInp.files[0]) processFile(fileInp.files[0]); };

clrBtn.onclick = () => {
  clearInterval(animTimer);
  cleanBlob = null; fileInp.value = '';
  metaBox.hidden = true; metaBox.innerHTML = '';
  hexBox.hidden = true; hexBox.innerHTML = '';
  if (prevUrl) { URL.revokeObjectURL(prevUrl); prevUrl = null; }
  scanBox.classList.remove('scanning');
  scanBox.innerHTML = '<div class="scan-grid"></div><div class="scan-beam"></div><span>Podgląd zdjęcia</span>';
  dlBtn.disabled = true; clrBtn.disabled = true; st.textContent = '';
};

dlBtn.onclick = () => {
  if (!cleanBlob) return;
  const a = document.createElement('a');
  const u = URL.createObjectURL(cleanBlob);
  a.href = u;
  a.download = cleanName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 1000);
};

function bytesToHex(view, max = 48) {
  const out = [];
  for (let i = 0; i < Math.min(max, view.byteLength); i++) {
    out.push(view.getUint8(i).toString(16).toUpperCase().padStart(2, '0'));
  }
  return out.join(' ');
}

async function processFile(file) {
  clearInterval(animTimer);
  dlBtn.disabled = true;
  clrBtn.disabled = true;
  metaBox.hidden = true;
  metaBox.innerHTML = '';
  hexBox.hidden = false;
  st.textContent = '[01/03] Skanowanie nagłówków pliku...';

  const buf = await file.arrayBuffer();
  const view = new DataView(buf);
  const info = scanExif(view);
  const realHex = bytesToHex(view, 48);

  const initUrl = URL.createObjectURL(file);
  scanBox.innerHTML = `<div class="scan-grid"></div><div class="scan-beam"></div><div class="prev-wrap"><img src="${initUrl}" alt=""></div>`;
  scanBox.classList.add('scanning');

  let ticks = 0;
  animTimer = setInterval(() => {
    ticks++;
    const prog = Math.min(100, ticks * 14);
    const mixed = realHex.split(' ').map((b, idx) => idx < (ticks * 5) ? b : randHex(2)).join(' ');
    hexBox.innerHTML = `HEX [${prog}%]: ${mixed}`;
  }, 55);

  await sleep(420);
  st.textContent = info.gps
    ? '[02/03] Wykryto współrzędne GPS — dekodowanie segmentów...'
    : '[02/03] Rozkodowywanie bloków EXIF / XMP / IPTC...';
  await sleep(420);

  clearInterval(animTimer);
  const tagSummary = info.hasMeta ? info.tags.join(' + ') : 'brak tagów';
  hexBox.innerHTML = `HEADER: <span class="tag-hi">${realHex.slice(0, 47)}</span> · <span class="ok-hi">${tagSummary}</span>`;

  const rows = [
    ['Nazwa pliku', file.name, false],
    ['Rozmiar oryginału', (file.size / 1024).toFixed(1) + ' KB', false],
    ['Metadane', info.hasMeta ? 'Wykryto (' + info.tags.join(', ') + ')' : 'Nie wykryto', info.hasMeta],
    ['Urządzenie', info.device || 'Brak danych', false],
    ['Dane GPS', info.gps ? 'TAK (ryzyko wycieku lokalizacji)' : 'Nie wykryto', info.gps]
  ];
  metaBox.innerHTML = '';
  metaBox.hidden = false;

  rows.forEach(([k, v, alert], idx) => {
    const d = document.createElement('div');
    d.style.animationDelay = (idx * 75) + 'ms';
    if (alert) d.className = 'gps-alert';
    const s1 = document.createElement('span'); s1.textContent = k;
    const s2 = document.createElement('span'); s2.textContent = v;
    d.append(s1, s2);
    metaBox.appendChild(d);
  });

  st.textContent = '[03/03] Przepisywanie pikseli przez canvas i usuwanie metadanych...';
  await sleep(320);

  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);

    const outType = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
    const ext = outType === 'image/png' ? '.png' : '.jpg';
    cleanName = (file.name.replace(/\.[^.]+$/, '') || 'obraz') + '_clean' + ext;

    canvas.toBlob(blob => {
      URL.revokeObjectURL(initUrl);
      scanBox.classList.remove('scanning');
      if (!blob) return;
      cleanBlob = blob;
      if (prevUrl) URL.revokeObjectURL(prevUrl);
      prevUrl = URL.createObjectURL(blob);
      scanBox.innerHTML = `<div class="scan-grid"></div><div class="scan-beam"></div><div class="prev-wrap"><img src="${prevUrl}" alt=""><small>${img.naturalWidth}×${img.naturalHeight} px • ${(blob.size / 1024).toFixed(1)} KB</small></div>`;
      dlBtn.disabled = false;
      clrBtn.disabled = false;
      st.textContent = 'Gotowe. Plik wyczyszczony ze śladów.';
    }, outType, 0.94);
  };
  img.onerror = () => {
    URL.revokeObjectURL(initUrl);
    scanBox.classList.remove('scanning');
    st.textContent = 'Nie udało się przetworzyć obrazu.';
  };
  img.src = initUrl;
}

function tiff(v, s) {
  const le = v.getUint16(s) === 0x4949, u16 = o => v.getUint16(o, le), u32 = o => v.getUint32(o, le), r = {};
  if (u16(s + 2) !== 42) return r;
  const o = s + u32(s + 4), n = u16(o);
  const str = e => { const c = u32(e + 4), p = c > 4 ? s + u32(e + 8) : e + 8; let t = ''; for (let i = 0; i < c - 1 && p + i < v.byteLength; i++) t += String.fromCharCode(v.getUint8(p + i)); return t.trim(); };
  for (let i = 0; i < n; i++) {
    const e = o + 2 + i * 12; if (e + 12 > v.byteLength) break;
    const t = u16(e);
    if (t === 0x8825) r.gps = true;
    if (t === 0x010F) r.make = str(e);
    if (t === 0x0110) r.model = str(e);
  }
  return r;
}

function scanExif(v) {
  const out = { hasMeta: false, gps: false, tags: [], device: '' };
  const add = t => { out.hasMeta = true; if (!out.tags.includes(t)) out.tags.push(t); };
  const merge = r => { if (r.gps) out.gps = true; if (r.make || r.model) out.device = [r.make, r.model].filter(Boolean).join(' '); };
  const ascii = (o, n) => { let t = ''; for (let i = 0; i < n && o + i < v.byteLength; i++) t += String.fromCharCode(v.getUint8(o + i)); return t; };
  try {
    if (v.getUint16(0) === 0xFFD8) {
      let o = 2;
      while (o + 4 < v.byteLength) {
        const m = v.getUint16(o);
        if (m === 0xFFDA || (m & 0xFF00) !== 0xFF00) break;
        const len = v.getUint16(o + 2);
        if (m === 0xFFE1) {
          if (ascii(o + 4, 6) === 'Exif\0\0') { add('EXIF'); merge(tiff(v, o + 10)); }
          else if (ascii(o + 4, 24).startsWith('http://ns.adobe.com/xap')) { add('XMP'); if (ascii(o + 4, Math.min(len, 60000)).includes('GPSLatitude')) out.gps = true; }
        } else if (m === 0xFFED) add('IPTC');
        o += 2 + len;
      }
    } else if (ascii(1, 3) === 'PNG') {
      let o = 8;
      while (o + 12 <= v.byteLength) {
        const len = v.getUint32(o), t = ascii(o + 4, 4);
        if (t === 'eXIf') { add('EXIF'); merge(tiff(v, o + 8)); }
        else if (t === 'iTXt' && ascii(o + 8, 17) === 'XML:com.adobe.xmp') add('XMP');
        else if (t === 'IDAT') break;
        o += 12 + len;
      }
    } else if (ascii(0, 4) === 'RIFF' && ascii(8, 4) === 'WEBP') {
      let o = 12;
      while (o + 8 <= v.byteLength) {
        const t = ascii(o, 4), len = v.getUint32(o + 4, true);
        if (t === 'EXIF') { add('EXIF'); let s = o + 8; if (ascii(s, 6) === 'Exif\0\0') s += 6; merge(tiff(v, s)); }
        else if (t === 'XMP ') add('XMP');
        o += 8 + len + (len & 1);
      }
    }
  } catch (err) {}
  return out;
}
</script>
</body>
</html>
